actions:
  openapiDirectoryCreated: false
  reason: |
    No OpenAPI, WSDL, JSON Schema or other machine-readable contract is published on
    any public Jetstar or Navitaire URL. The production and test endpoints refuse
    connections without a client certificate and an allow-listed IP, so no WSDL could
    be retrieved. Nothing was generated or inferred from operation names, and no
    openapi/ directory was created.
  apisYmlListsOneApi: true
  apisYmlNote: |
    The single apis[] entry is the Jetstar API. It is listed because Jetstar itself
    names it, publishes its base URLs, publishes its operation names and runs a
    registration flow for it — it is real and documented, merely gated. The
    apiblog.jetstar.com WordPress REST API was deliberately NOT listed: it is CMS
    infrastructure, not a Jetstar distribution product.
