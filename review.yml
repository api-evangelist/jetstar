  method: curl (HTTP/2 and HTTP/1.1, browser User-Agent) plus WebFetch; dig for DNS
  note: |
    www.jetstar.com and newsroom.jetstar.com are Akamai-fronted and refused every
    automated client from this environment (connection reset / HTTP/2 INTERNAL_ERROR /
    timeout, recorded as HTTP 000). PDFs served from the same host under /_/media/
    DID return 200, and files.jetstar.com and the Sitecore Content Hub delivery domain
    also returned 200, so page-level content was recovered through those paths and
    through search results rather than through direct HTML fetches. HTTP 000 below
    means "no response obtained from this environment", not "does not exist".
