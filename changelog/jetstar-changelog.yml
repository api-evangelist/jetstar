  itself is the machine-readable form of Jetstar's partner changelog.
docs: https://apiblog.jetstar.com/
description: >-
  Jetstar runs a genuine, long-running, dated release-and-incident feed for API
  partners on its portal. It is a change feed rather than a versioned API
  changelog: entries are platform notifications (Navitaire New Skies upgrades,
  cloud migrations, scheduled maintenance, incidents) plus commercial changes
  that alter API behaviour (bundle and fare-family renames, zoned seat pricing,
  route launches/discontinuations). Recorded here is the recent window and the
  structural facts; the live feed is the source of truth.
gated: true
gating_note: >-
  Post bodies are readable anonymously over the WordPress REST API but the
  rendered pages sit behind the partner login. Deep links below therefore 200
  with the login shell for the public.

