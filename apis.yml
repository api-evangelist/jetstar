description: Jetstar Airways Pty Limited (ABN 33 069 720 243) is the Melbourne-based
  low-cost carrier of the Qantas Group and, with Virgin Australia, one half of the
  Australian domestic duopoly. The Jetstar Group flies as Jetstar Airways (JQ) and
  Jetstar Japan (GK); Jetstar Asia (3K) flew its last service on 31 July 2025. Jetstar
  sits at the direct-distribution end of the Australian travel chain — it sells through
  jetstar.com, through the Jetstar Agent Hub, through seven GDSs, and through a
  partner channel it calls, literally, the Jetstar API. That API is not a public
  developer product and it is not IATA NDC — it is the Navitaire New Skies SOAP web
  service (NSK 4.6) hosted on the vendor's own domain at jqapi.navitaire.com, with
  documentation, registration and downloads behind a login at apiblog.jetstar.com.
  There is no public developer portal, no OpenAPI or WSDL published, no self-serve
  signup and no bulk export operation. Access requires GoStandard or GoGlobal IATA
  accreditation for BSP settlement plus separate Jetstar approval, Registered Agent
  status under Jetstar's Travel Agent Terms and Conditions, a client certificate and
  IP allow-listing. Jetstar's own trade communications name only three authorised
  booking facilities for Registered Agents — API, GDS and Jetstar Agent Hub — and
  state that Registered Agents may only access Jetstar Data and make bookings via the
  API for all online distribution.
