apis:
- aid: jetstar:jetstar-api
  name: Jetstar API
  description: The Jetstar API is Jetstar's direct-connect distribution channel for
    Registered Travel Agents and partners. It is a Navitaire New Skies (NSK) SOAP /
    WCF web service, not a REST product and not IATA NDC. Jetstar's own partner FAQ
    publishes the environments as NSK 4.6 with production at https://jqapi.navitaire.com
    and test at https://soapapir4y.test.jq.navitaire.com, and documents WCF services
    such as UtilitiesManager.svc alongside session-signature authentication.
    Operations named in Jetstar's published partner documentation include
    GetAvailability, GetTripAvailabilityWithSSR, PriceItinerary, GetItineraryPrice,
    GetSSRAvailability, GetStationList, AddPaymentToBooking, BookingCommit,
    GetBooking and UpdatePassengers. Documentation, registration, an API Products
    page and a Download Centre live at apiblog.jetstar.com behind a partner login;
    no OpenAPI, WSDL or machine-readable contract is published publicly. Access
    requires IATA accreditation plus separate Jetstar approval, and the service
    endpoints refuse connections from non-allow-listed clients.
  humanURL: https://apiblog.jetstar.com/
  baseURL: https://jqapi.navitaire.com
